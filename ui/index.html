    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SismoAI Trainer</title>
    <link rel="stylesheet" href="css/variables.css" />
    <link rel="stylesheet" href="css/layout.css" />

    <link rel="stylesheet" href="css/workspace.css" />
    <link rel="stylesheet" href="css/modal.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->

        </div>

            class="nav-item active"
            data-action="navigate"
            data-view="proyecto"
            href="#"

                fill="none"

                />
                <polyline points="14 2 14 8 20 8" />
                <line x1="16" y1="13" x2="8" y2="13" />
                <line x1="16" y1="17" x2="8" y2="17" />
              </svg>
            </div>
            <span>Datos</span>
          </a>
          <a
            class="nav-item"
            data-action="navigate"
            data-view="analisis"
            href="#"
          >
            <div class="nav-item-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="2 12 5 12 8 4 12 20 16 4 19 12 22 12" />
              </svg>
            </div>
            <span>Análisis</span>
          </a>
          <a
            class="nav-item"
            data-action="navigate"
            data-view="ventanas"
            href="#"
          >
            <div class="nav-item-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />

            </div>
            <span>Ventanas</span>
          </a>
          <a

            data-action="navigate"

            href="#"
          >
            <div class="nav-item-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"

                viewBox="0 0 24 24"

                stroke-width="2"
                stroke-linecap="round"

                <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />

            data-action="navigate"
            data-view="modelos"
            href="#"
          >
            <div class="nav-item-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"

                <line x1="12" y1="17" x2="12" y2="21" />

            </div>

                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
            </div>
            <span>Exportar</span>

            class="nav-item"
            data-action="navigate"
            data-view="ajustes"
            href="#"

                viewBox="0 0 24 24"

                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >

                  d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"

            <span>Ajustes</span>
          </a>
        </nav>
      </aside>

      <!-- Main Content -->
      <main class="main-content">
        <!-- Topbar -->
        <header class="topbar">
          <div class="topbar-heading">
            <div class="topbar-heading-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="2 12 5 12 8 4 12 20 16 4 19 12 22 12" />
              </svg>
            </div>
            <div>
              <h1 class="topbar-title" id="topbar-title">Proyecto</h1>
              <p class="topbar-subtitle" id="topbar-subtitle">Workspace</p>
            </div>
          </div>
          <div class="topbar-spacer"></div>
          <div class="topbar-status" id="topbar-status">
            <div class="topbar-status-dot"></div>
            <span>Listo</span>
          </div>
        </header>

        <!-- View Container -->
        <div class="view-container" id="view-container">
          <!-- Views will be loaded here dynamically -->
          <div class="empty-state">
            <div class="empty-state-icon">📊</div>
            <div class="empty-state-title">SismoAI Trainer</div>
            <div class="empty-state-text">
              Selecciona una vista para comenzar
            </div>
          </div>
        </div>

      </main>
    </div>

    <!-- Scripts -->
    <script src="js/bridge.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/charts.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ventanas.js"></script>
    <script src="js/etiquetado.js"></script>
    <script src="js/dataset.js"></script>
    <script src="js/modelos.js"></script>
    <script src="js/exportar.js"></script>
    <script src="js/ajustes.js"></script>
  </body>
</html>
