<!-- Vista: Proyecto — Selección de carpeta origen y estado de inspección -->
<div class="project-view workspace-view">
  <!-- Carpeta de datos -->
  <div class="card project-data-card">
    <div class="card-header">
      <h2 class="card-title">Carpeta de datos</h2>
    </div>
    <div class="card-body">
      <div class="folder-input-wrapper">
        <div class="folder-input">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            />
          </svg>
          <span id="project-folder-path">Selecciona una carpeta...</span>
        </div>
        <button class="btn btn-outline" data-action="select-folder">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="width: 16px; height: 16px"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            />
          </svg>
          Seleccionar carpeta
        </button>
      </div>

      <div class="status-row">
        <div class="status-item success">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
            <polyline points="22 4 12 14.01 9 11.01" />
          </svg>
          <span id="project-status-text">Carpeta disponible</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"
            />
          </svg>
          <span id="project-file-count-text">0 archivos BIN detectados</span>
        </div>
        <div class="status-divider"></div>
        <div class="status-item">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="12" cy="12" r="10" />
            <polyline points="12 6 12 12 16 14" />
          </svg>
          <span id="project-last-scan">Última actualización: —</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Resumen -->
  <div class="card mt-md project-summary-card">
    <div class="card-header">
      <h2 class="card-title">Resumen</h2>
    </div>
    <div class="card-body">
      <div class="summary-grid">
        <div class="summary-card">
          <div class="summary-card-icon blue">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
              <polyline points="10 9 9 9 8 9" />
            </svg>
          </div>
          <div class="summary-card-content">
            <h3 id="summary-file-count">0</h3>
            <p>Archivos BIN</p>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card-icon blue">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="8" y1="6" x2="21" y2="6" />
              <line x1="8" y1="12" x2="21" y2="12" />
              <line x1="8" y1="18" x2="21" y2="18" />
              <line x1="3" y1="6" x2="3.01" y2="6" />
              <line x1="3" y1="12" x2="3.01" y2="12" />
              <line x1="3" y1="18" x2="3.01" y2="18" />
            </svg>
          </div>
          <div class="summary-card-content">
            <h3 id="summary-event-count">0</h3>
            <p>Eventos</p>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card-icon purple">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
            </svg>
          </div>
          <div class="summary-card-content">
            <h3>Pendiente</h3>
            <p>Ventanas</p>
          </div>
        </div>

        <div class="summary-card">
          <div class="summary-card-icon purple">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
              />
              <line x1="7" y1="7" x2="7.01" y2="7" />
            </svg>
          </div>
          <div class="summary-card-content">
            <h3>Pendiente</h3>
            <p>Etiquetadas</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
